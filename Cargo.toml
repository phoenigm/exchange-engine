[workspace]
members = [
    ".",
    "crates/domain",
    "crates/application",
    "crates/ports",
    "crates/adapters",
    "crates/platform",
    "services/trading-api",
    "services/market-data-api",
    "services/wallet-worker",
    "services/risk-worker",
    "services/liquidation-worker",
]
resolver = "2"

[package]
name = "exchange-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
